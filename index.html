<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Release — a quiet, guided introduction to Lester Levenson's release technique. Nothing to fix, just release." />
    <link rel="icon" href="data:," />
    <title>Release</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap');

      :root {
        color-scheme: dark;
        /* Dusk: deep plum, near-black */
        --dawn-top: #2b2338;
        --dawn-mid: #3d2b3f;
        --dawn-low: #1e1b2e;
        --ink: #f3e9e4;
        --ink-soft: #c4b3bd;
        --apricot: #f0966c;
        --apricot-deep: #e8835a;
        --card: rgba(255, 240, 230, 0.07);
        --card-border: rgba(243, 233, 228, 0.14);
        --chip: rgba(255, 240, 230, 0.08);
        --ring: rgba(240, 150, 108, 0.4);
        --radius: 20px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* No overscroll bounce or pull-to-refresh anywhere in the app: a
         downward pull at the top must never reload the page and throw the
         visitor back to the homepage mid-session. */
      html, body { overscroll-behavior: none; }

      body {
        background: linear-gradient(180deg, var(--dawn-top) 0%, var(--dawn-mid) 52%, var(--dawn-low) 100%);
        background-attachment: fixed;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      .font-display { font-family: "Fraunces", Georgia, "Times New Roman", serif; }

      /* Slow breathing: one 12s cycle */
      @keyframes breathe {
        0% { transform: scale(0.78); opacity: 0.55; }
        40% { transform: scale(1); opacity: 1; }
        60% { transform: scale(1); opacity: 0.95; }
        100% { transform: scale(0.78); opacity: 0.55; }
      }
      .breathing-circle { animation: breathe 12s ease-in-out infinite; will-change: transform, opacity; }

      @keyframes screen-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .screen-in { animation: screen-in 0.9s ease both; }

      @media (prefers-reduced-motion: reduce) {
        .breathing-circle { animation-duration: 24s; }
        .screen-in { animation: none; }
      }

      /* Layout */
      .page { display: flex; min-height: 100vh; flex-direction: column; }
      .wrap { margin: 0 auto; width: 100%; max-width: 36rem; flex: 1; padding-left: 1.5rem; padding-right: 1.5rem; display: flex; flex-direction: column; }
      .grow { flex: 1; display: flex; flex-direction: column; }
      .center-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3.5rem 0; text-align: center; }

      /* Buttons */
      .btn-primary {
        display: block; width: 100%; border: none; cursor: pointer;
        border-radius: 999px; background: var(--apricot); color: #fff;
        padding: 1rem 2rem; font-size: 1.125rem; font-weight: 500; font-family: inherit;
        box-shadow: 0 10px 15px -3px rgba(217, 111, 69, 0.3), 0 4px 6px -4px rgba(217, 111, 69, 0.3);
        transition: opacity 0.2s ease;
      }
      .btn-primary:disabled { opacity: 0.4; cursor: default; }
      .btn-quiet {
        display: block; width: 100%; cursor: pointer;
        border-radius: 999px; border: 1px solid var(--card-border); background: var(--card);
        color: var(--ink); padding: 1rem 2rem; font-size: 1.125rem; font-family: inherit;
        backdrop-filter: blur(4px); transition: border-color 0.2s ease;
      }
      .btn-quiet:hover { border-color: var(--apricot); }
      .link-plain { background: none; border: none; cursor: pointer; font-family: inherit; color: var(--ink-soft); font-size: 1rem; text-decoration: underline; text-underline-offset: 4px; padding: 0; }
      .link-strong { background: none; border: none; cursor: pointer; font-family: inherit; color: var(--ink); font-size: 1rem; font-weight: 500; text-decoration: underline; text-decoration-color: var(--apricot); text-decoration-thickness: 2px; text-underline-offset: 4px; padding: 0; }

      /* Cards */
      .card {
        border-radius: var(--radius); border: 1px solid var(--card-border);
        background: var(--card); backdrop-filter: blur(4px);
      }
      .choice-card {
        display: block; width: 100%; text-align: left; cursor: pointer; font-family: inherit;
        border-radius: var(--radius); border: 1px solid var(--card-border); background: var(--card);
        padding: 1.5rem; backdrop-filter: blur(4px); color: var(--ink);
        transition: border-color 0.2s ease, background-color 0.2s ease;
      }
      .choice-card:hover { border-color: var(--apricot); }
      .choice-card.selected { border-color: var(--apricot); box-shadow: 0 0 0 2px var(--ring); }
      .card-title { font-family: "Fraunces", Georgia, serif; font-size: 1.5rem; line-height: 1.3; display: block; }
      .card-sub { display: block; margin-top: 0.25rem; font-size: 1rem; line-height: 1.625; color: var(--ink-soft); }

      /* Anchor */
      .anchor {
        margin-top: 1.25rem; border-radius: var(--radius);
        border: 1px solid var(--apricot); background: var(--card);
        padding: 1rem 1.25rem; backdrop-filter: blur(4px);
        box-shadow: 0 0 0 2px var(--ring);
      }
      .anchor.in-questions { padding: 1.25rem; text-align: center; }
      .anchor .prefix { font-size: 0.875rem; font-weight: 600; color: var(--apricot-deep); }
      .anchor .main { font-family: "Fraunces", Georgia, serif; margin-top: 0.25rem; font-weight: 500; line-height: 1.25; color: var(--ink); font-size: 1.875rem; overflow-wrap: break-word; }
      .anchor.in-questions .main { font-size: 2.25rem; }
      .anchor .main.small { font-size: 1.5rem; }
      .anchor.in-questions .main.small { font-size: 1.75rem; }
      .anchor .main.apricot { color: var(--apricot-deep); }
      .anchor .meta { margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.25; color: var(--ink-soft); }
      .anchor .meta .num { font-weight: 600; color: var(--apricot-deep); }
      .anchor .wanting-name { font-family: "Fraunces", Georgia, serif; font-weight: 500; line-height: 1.25; color: var(--apricot-deep); font-size: 1.875rem; overflow-wrap: break-word; }
      .anchor.in-questions .wanting-name { font-size: 2.25rem; }
      .anchor .wanting-line { margin-top: 0.25rem; font-size: 1rem; color: var(--ink-soft); }

      .anchor-state { border-radius: 14px; border: 1px solid transparent; padding: 0.75rem 0.875rem; }
      .anchor-state + .anchor-state { margin-top: 0.625rem; }
      .anchor-state .lead { font-size: 13px; font-weight: 600; }
      .anchor-state .goal { font-family: "Fraunces", Georgia, serif; font-size: 1.25rem; font-weight: 500; line-height: 1.375; overflow-wrap: break-word; }
      .anchor-state .desc { margin-top: 0.125rem; font-size: 13px; line-height: 1.375; color: var(--ink-soft); }

      /* Range slider */
      input[type="range"].dawn-range {
        -webkit-appearance: none; appearance: none; width: 100%;
        height: 6px; border-radius: 999px; outline: none;
        background: linear-gradient(90deg, var(--apricot) var(--fill, 50%), rgba(160, 140, 160, 0.3) var(--fill, 50%));
      }
      input[type="range"].dawn-range::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 34px; height: 34px; border-radius: 50%;
        background: var(--apricot); border: 3px solid #fff7f2;
        box-shadow: 0 2px 10px rgba(20, 12, 25, 0.45); cursor: pointer;
      }
      input[type="range"].dawn-range::-moz-range-thumb {
        width: 30px; height: 30px; border-radius: 50%;
        background: var(--apricot); border: 3px solid #fff7f2;
        box-shadow: 0 2px 10px rgba(20, 12, 25, 0.45); cursor: pointer;
      }

      /* Feeling chart */
      .group-head {
        display: flex; width: 100%; align-items: center; justify-content: space-between;
        padding: 1rem 1.25rem; background: none; border: none; cursor: pointer; font-family: inherit;
        text-align: left; color: var(--ink);
      }
      .word-chip {
        border-radius: 999px; border: 1px solid var(--card-border); background: var(--chip);
        padding: 0.5rem 1rem; font-size: 1rem; color: var(--ink); cursor: pointer; font-family: inherit;
        backdrop-filter: blur(4px); transition: border-color 0.2s ease;
      }
      .word-chip:hover { border-color: var(--apricot); }

      .text-input {
        width: 100%; border-radius: var(--radius); border: 1px solid var(--card-border);
        background: var(--card); padding: 1rem 1.25rem; font-size: 1.125rem; color: var(--ink);
        font-family: inherit; backdrop-filter: blur(4px); outline: none;
      }
      .text-input::placeholder { color: var(--ink-soft); }
      .text-input:focus { box-shadow: 0 0 0 2px var(--ring); }

      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      /* Footer */
      footer { padding: 1rem 1.5rem 2.5rem; text-align: center; }
      footer .fine { font-size: 0.75rem; line-height: 1.625; color: var(--ink-soft); }
      .avatar-btn { display: block; margin: 0.375rem auto 0; background: none; border: none; cursor: pointer; border-radius: 999px; padding: 0; transition: transform 0.2s ease; }
      .avatar-btn:hover { transform: scale(1.1); }
      .avatar-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      .avatar-btn img { display: block; width: 22px; height: 22px; border-radius: 999px; object-fit: cover; }
      .avatar-overlay {
        position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
        background: rgba(24, 16, 30, 0.78); padding: 2rem; backdrop-filter: blur(4px);
      }
      .avatar-overlay img { width: 16rem; height: 16rem; border-radius: 999px; object-fit: cover; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); outline: 4px solid var(--ring); }
      @media (min-width: 640px) { .avatar-overlay img { width: 20rem; height: 20rem; } }
      .avatar-close {
        position: absolute; right: 1.25rem; top: 1.25rem; width: 2.75rem; height: 2.75rem;
        display: flex; align-items: center; justify-content: center; border-radius: 999px;
        background: var(--card); border: 1px solid var(--card-border); color: var(--ink);
        font-size: 1.5rem; line-height: 1; cursor: pointer; font-family: inherit;
      }

      .stack > * + * { margin-top: 0.75rem; }
      .stack-lg > * + * { margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding:2rem;text-align:center">Release needs JavaScript to guide a session.</p></noscript>

    <script>
    "use strict";

    /* ── Language ─────────────────────────────────────────────────── */
    // The visitor's language choice is remembered in this browser;
    // first visit defaults to Chinese when the browser language is
    // Chinese, otherwise English.
    var LANG_KEY = "release-lang";
    function detectLang() {
      try {
        var saved = window.localStorage.getItem(LANG_KEY);
        if (saved === "zh" || saved === "en") return saved;
      } catch (e) {}
      var nav = (navigator.language || "").toLowerCase();
      return nav.indexOf("zh") === 0 ? "zh" : "en";
    }
    var LANG = detectLang();
    function L(en, zh) { return LANG === "zh" ? zh : en; }
    document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";

    function setLang(next) {
      if (LANG === next) return;
      LANG = next;
      try { window.localStorage.setItem(LANG_KEY, next); } catch (e) {}
      document.documentElement.lang = next === "zh" ? "zh-CN" : "en";
      render(false);
    }

    function langBarHTML() {
      var base = "border:1px solid var(--card-border);background:transparent;color:var(--ink-soft);padding:0.3rem 0.85rem;font-size:0.875rem;cursor:pointer;font-family:inherit";
      var active = "border:1px solid var(--apricot);background:var(--card);color:var(--ink);padding:0.3rem 0.85rem;font-size:0.875rem;cursor:pointer;font-family:inherit;font-weight:600";
      return '<div style="display:flex;justify-content:flex-end;gap:0.5rem;padding-top:1rem" role="group" aria-label="Language">' +
        '<button type="button" style="border-radius:999px;' + (LANG === "en" ? active : base) + '" data-action="lang-en" aria-pressed="' + (LANG === "en") + '">EN</button>' +
        '<button type="button" style="border-radius:999px;' + (LANG === "zh" ? active : base) + '" data-action="lang-zh" aria-pressed="' + (LANG === "zh") + '">中文</button></div>';
    }

    /* ── Data ─────────────────────────────────────────────────────── */

    var WANTINGS = [
      { id: "approval", name: "Approval", nameZh: "想要认可", line: "I want them to like me, accept me, forgive me.", lineZh: "想被喜欢，想被接纳，想被原谅。" },
      { id: "control",  name: "Control",  nameZh: "想要控制", line: "I want it to go my way.", lineZh: "想让事情照我的意思来。" },
      { id: "security", name: "Security", nameZh: "想要安全", line: "I want to feel safe. I want to be sure.", lineZh: "想要安全感，想要心里有底。" }
    ];
    function wantingShort(w) { return LANG === "zh" ? w.nameZh : w.name; }
    function wantingFull(w) { return LANG === "zh" ? w.nameZh : ("Wanting " + w.name); }
    function wantingLine(w) { return LANG === "zh" ? w.lineZh : w.line; }

    var EMOTION_GROUPS = [
      { name: "Apathy", nameZh: "万念俱灰",
        words: ["Bored","Can't win","Cold","Dead","Defeated","Depressed","Discouraged","Drained","Hopeless","I can't","Indifferent","Lost","Numb","Overwhelmed","Resigned","Stuck","Too tired","Useless","What's the use?","Worthless"],
        wordsZh: ["无聊","赢不了","冷漠","心如死灰","被击败","沮丧","泄气","精疲力竭","绝望","我不行","漠不关心","迷失","麻木","不堪重负","逆来顺受","卡住了","太累了","没用","有什么用","毫无价值"] },
      { name: "Grief", nameZh: "悲苦",
        words: ["Abandoned","Ashamed","Betrayed","Disappointed","Guilty","Heartbroken","Hurt","It's not fair","Longing","Loss","Nobody cares","Poor me","Regret","Rejected","Sadness","Unloved","Unwanted","Wounded"],
        wordsZh: ["被遗弃","羞耻","被背叛","失望","内疚","心碎","受伤","这不公平","思念","失落","没人在乎我","我真可怜","后悔","被拒绝","悲伤","不被爱","没人要","心里有伤"] },
      { name: "Fear", nameZh: "恐惧",
        words: ["Anxious","Cautious","Dread","Insecure","Nervous","Panic","Paranoid","Scared","Shy","Suspicious","Tense","Trapped","Uncertain","Vulnerable","Worry"],
        wordsZh: ["焦虑","小心谨慎","惧怕","没有安全感","紧张","恐慌","偏执","害怕","害羞","猜忌","紧绷","被困住","不确定","脆弱","担忧"] },
      { name: "Lust", nameZh: "贪求",
        words: ["Can't wait","Compulsive","Craving","Demanding","Driven","Envy","Greedy","Impatient","Must have it","Never enough","Obsessed","Possessive","Pushy","Selfish"],
        wordsZh: ["迫不及待","强迫性","渴求","苛刻","被欲望驱使","嫉妒","贪婪","不耐烦","必须得到","永远不够","迷恋","占有欲强","咄咄逼人","自私"] },
      { name: "Anger", nameZh: "愤怒",
        words: ["Aggressive","Annoyed","Argumentative","Disgust","Frustrated","Furious","Hatred","Hostile","Irritated","Jealous","Outraged","Resentful","Spiteful","Stubborn"],
        wordsZh: ["攻击性强","恼火","爱争辩","厌恶","懊恼","暴怒","仇恨","敌意","烦躁","妒火中烧","愤慨","怨恨","记恨","固执"] },
      { name: "Pride", nameZh: "自尊自傲",
        words: ["Arrogant","Boastful","Complacent","Contempt","Critical","Gloating","Judgmental","Never wrong","Rigid","Smug","Snobbish","Unforgiving","Vain"],
        wordsZh: ["傲慢","自夸","自满","鄙视","挑剔","幸灾乐祸","爱评判","永远没错","死板","自鸣得意","势利","不肯原谅","虚荣"] }
    ];
    function groupName(g) { return LANG === "zh" ? g.nameZh : g.name; }
    function groupWords(g) { return LANG === "zh" ? g.wordsZh : g.words; }

    var QUESTIONS = ["could", "would", "when"];
    var LOVE_QUESTIONS = ["loveCould", "loveWould", "loveWhen"];

    /* ── Storage ──────────────────────────────────────────────────── */
    // History lives only in this browser's local storage — no account,
    // nothing leaves the device.
    var HISTORY_KEY = "release-history";
    // The current screen + mid-session state live in per-tab session
    // storage, so a stray reload lands back on the exact screen and step.
    var SCREEN_STATE_KEY = "release-screen-state";

    function loadHistory() {
      try {
        var raw = window.localStorage.getItem(HISTORY_KEY);
        if (!raw) return [];
        var parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(function (r) {
          return r && typeof r.topic === "string" && typeof r.date === "string";
        }).map(function (r) {
          return {
            topic: r.topic,
            before: typeof r.before === "number" ? r.before : 0,
            after: typeof r.after === "number" ? r.after : 0,
            layers: typeof r.layers === "number" ? r.layers : 1,
            date: r.date
          };
        });
      } catch (e) { return []; }
    }

    function saveHistoryEntry(entry) {
      try {
        var list = loadHistory();
        list.unshift(entry);
        window.localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 200)));
      } catch (e) { /* storage unavailable — the session still completes */ }
    }

    /* ── Screen-state snapshot ────────────────────────────────────── */
    var VIEW_VALUES = ["home", "how", "history", "session"];
    var STEP_VALUES = ["choose","feeling","goalInput","goalFork","shortcutIntro","shortcutChoice","before","wanting","could","would","when","after","layerChoice","shortcutCheck","shortcutTurning","loveIntro","loveCould","loveWould","loveWhen"];
    var PATH_VALUES = ["feeling", "goal", "wanting", "shortcut"];
    var WANTING_VALUES = ["approval", "control", "security"];

    function loadSnapshot() {
      try {
        var raw = window.sessionStorage.getItem(SCREEN_STATE_KEY);
        if (!raw) return null;
        var p = JSON.parse(raw);
        if (typeof p.view !== "string" || VIEW_VALUES.indexOf(p.view) === -1) return null;
        if (typeof p.step !== "string" || STEP_VALUES.indexOf(p.step) === -1) return null;
        var num = function (v, fb) { return (typeof v === "number" && isFinite(v)) ? v : fb; };
        var str = function (v) { return typeof v === "string" ? v : ""; };
        return {
          view: p.view,
          step: p.step,
          path: (typeof p.path === "string" && PATH_VALUES.indexOf(p.path) !== -1) ? p.path : null,
          feelingWord: str(p.feelingWord),
          goalText: str(p.goalText),
          forkChoice: (p.forkChoice === "wanting" || p.forkChoice === "having") ? p.forkChoice : null,
          shortcutEnding: (p.shortcutEnding === "rest" || p.shortcutEnding === "quiet") ? p.shortcutEnding : null,
          recordTopic: str(p.recordTopic),
          before: num(p.before, 5),
          wanting: (typeof p.wanting === "string" && WANTING_VALUES.indexOf(p.wanting) !== -1) ? p.wanting : null,
          after: num(p.after, 5),
          layers: Math.max(1, Math.floor(num(p.layers, 1))),
          hasBefore: p.hasBefore === true,
          hasAfter: p.hasAfter === true,
          finished: p.finished === true
        };
      } catch (e) { return null; }
    }

    /* ── State ────────────────────────────────────────────────────── */
    var restored = loadSnapshot();

    var S = {
      view: restored ? restored.view : "home",
      step: restored ? restored.step : "choose",
      path: restored ? restored.path : null,
      feelingWord: restored ? restored.feelingWord : "",
      expandedGroup: null,
      dontKnowOpen: false,
      goalText: restored ? restored.goalText : "",
      forkChoice: restored ? restored.forkChoice : null,
      shortcutEnding: restored ? restored.shortcutEnding : null,
      recordTopic: restored ? restored.recordTopic : "",
      before: restored ? restored.before : 5,
      wanting: restored ? restored.wanting : null,
      after: restored ? restored.after : 5,
      layers: restored ? restored.layers : 1,
      hasBefore: restored ? restored.hasBefore : false,
      hasAfter: restored ? restored.hasAfter : false,
      finished: restored ? restored.finished : false,
      saved: restored ? restored.finished : false, // a restored end screen was already saved
      avatarOpen: false
    };

    function persistSnapshot() {
      try {
        window.sessionStorage.setItem(SCREEN_STATE_KEY, JSON.stringify({
          view: S.view, step: S.step, path: S.path,
          feelingWord: S.feelingWord, goalText: S.goalText,
          forkChoice: S.forkChoice, shortcutEnding: S.shortcutEnding,
          recordTopic: S.recordTopic, before: S.before, wanting: S.wanting,
          after: S.after, layers: S.layers, hasBefore: S.hasBefore,
          hasAfter: S.hasAfter, finished: S.finished
        }));
      } catch (e) { /* app still works; a reload just falls back home */ }
    }

    /* ── Helpers ──────────────────────────────────────────────────── */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function intensityWord(v) {
      return v === 0 ? L("Nothing there", "一点也没有") : v <= 3 ? L("Light", "很轻") : v <= 6 ? L("Noticeable", "明显") : v <= 8 ? L("Heavy", "很重") : L("Very heavy", "非常重");
    }

    function wantingInfo() {
      for (var i = 0; i < WANTINGS.length; i++) if (WANTINGS[i].id === S.wanting) return WANTINGS[i];
      return null;
    }

    function scrollToTop() {
      try { window.scrollTo(0, 0); } catch (e) {}
      if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }

    function circle(size) {
      var inner = Math.round(size * 0.82);
      return '<div aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:' + size + 'px;height:' + size + 'px">' +
        '<div class="breathing-circle" style="border-radius:999px;width:' + inner + 'px;height:' + inner + 'px;' +
        'background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.85), rgba(246,190,170,0.55) 55%, rgba(232,131,90,0.35) 100%);' +
        'box-shadow:0 0 60px 10px var(--ring)"></div></div>';
    }

    function sliderHTML(value, label) {
      var word = intensityWord(value);
      return '<div style="width:100%">' +
        '<div style="margin-bottom:1.5rem;text-align:center">' +
          '<span class="font-display" style="font-size:4.5rem;font-weight:300;line-height:1;color:var(--ink)">' + value + '</span>' +
          '<span style="margin-left:0.75rem;font-size:1.125rem;color:var(--ink-soft)">' + word + '</span>' +
        '</div>' +
        '<input type="range" min="0" max="10" step="1" value="' + value + '" aria-label="' + esc(label) + '" class="dawn-range" id="intensity-slider" style="--fill:' + (value * 10) + '%">' +
        '<div style="margin-top:0.75rem;display:flex;justify-content:space-between;font-size:0.875rem;color:var(--ink-soft)">' +
          '<span>' + L("0 — nothing", "0 — 一点都没有") + '</span><span>' + L("10 — the heaviest", "10 — 最重") + '</span>' +
        '</div></div>';
    }

    function primaryBtn(text, action, disabled) {
      return '<button type="button" class="btn-primary" data-action="' + action + '"' + (disabled ? " disabled" : "") + '>' + text + '</button>';
    }
    function quietBtn(text, action) {
      return '<button type="button" class="btn-quiet" data-action="' + action + '">' + text + '</button>';
    }

    /* ── Anchor ───────────────────────────────────────────────────── */
    function inReleaseQuestions() {
      return ["could","would","when","shortcutCheck","loveCould","loveWould","loveWhen"].indexOf(S.step) !== -1;
    }
    function isLoveStep() {
      return ["loveIntro","loveCould","loveWould","loveWhen"].indexOf(S.step) !== -1;
    }
    function showAnchor() {
      if (["choose","feeling","goalInput","goalFork","shortcutIntro","shortcutChoice","shortcutTurning"].indexOf(S.step) !== -1) return false;
      if (S.path === "feeling") return S.feelingWord.length > 0;
      if (S.path === "goal") return S.goalText.trim().length > 0;
      if (S.path === "shortcut") return true;
      if (S.path === "wanting") {
        if (S.step === "wanting") return false;
        return S.wanting !== null;
      }
      return false;
    }

    // Goal anchor: the light follows the current wanting intensity — the
    // live re-rate on the "after" screen, and the last re-rate everywhere
    // after it (release questions, new layers), otherwise the starting
    // rating. Once the user has re-rated, the starting rating must never
    // light the cards again.
    function goalCurrentIntensity() {
      return (S.step === "after" || S.step === "layerChoice" || S.hasAfter || S.layers > 1) ? S.after : S.before;
    }
    function mixPct(base, extra) { return "color-mix(in srgb, var(--apricot) " + Math.round(base + extra) + "%, transparent)"; }

    function anchorHTML() {
      var w = wantingInfo();
      var inQ = inReleaseQuestions();
      var cls = "anchor" + (inQ ? " in-questions" : "");
      var h = "";

      var showWantingLine = w !== null && S.path !== "wanting" &&
        ["could","would","when","after","layerChoice"].indexOf(S.step) !== -1;

      if (S.path === "goal") {
        var cur = Math.max(0, Math.min(10, goalCurrentIntensity()));
        var wantingLit = cur / 10, havingLit = 1 - wantingLit;
        var goal = esc(S.goalText.trim());
        function stateStyle(lit) {
          return "opacity:" + (0.38 + 0.62 * lit).toFixed(3) +
            ";background-color:" + mixPct(0, lit * 16) +
            ";border-color:" + mixPct(10, lit * 72) +
            (lit > 0.02 ? ";box-shadow:0 0 " + Math.round(lit * 18) + "px color-mix(in srgb, var(--ring) " + Math.round(lit * 65) + "%, transparent)" : ";box-shadow:none") +
            ";transition:opacity 700ms ease, background-color 700ms ease, border-color 700ms ease, box-shadow 700ms ease";
        }
        function labelStyle(lit) {
          return "color:color-mix(in srgb, var(--apricot-deep) " + Math.round(25 + lit * 75) + "%, var(--ink-soft));transition:color 700ms ease";
        }
        function goalStyle(lit) {
          return "color:color-mix(in srgb, var(--ink) " + Math.round(50 + lit * 50) + "%, var(--ink-soft));transition:color 700ms ease";
        }
        var wantingLabel = L("Wanting", "想要");
        var havingLabel = L("Having", "拥有");
        h += '<section class="' + cls + '" aria-label="' + esc(L("You are releasing: Wanting ", "你正在释放：想要") + S.goalText.trim() + L(". Current wanting ", "。现在的强度是 ") + cur + L(" out of 10.", " / 10。")) + '">' +
          '<div style="text-align:left">' +
            '<div class="anchor-state" data-lit="' + wantingLit.toFixed(2) + '" style="' + stateStyle(wantingLit) + '">' +
              '<p style="line-height:1.375"><span class="lead" style="' + labelStyle(wantingLit) + '">' + wantingLabel + '&nbsp;</span>' +
              '<span class="goal" style="' + goalStyle(wantingLit) + '">' + goal + '</span></p>' +
              '<p class="desc">' + L("The ache of not having it yet.", "还没得到，心里难受。") + '</p>' +
            '</div>' +
            '<div class="anchor-state" data-lit="' + havingLit.toFixed(2) + '" style="' + stateStyle(havingLit) + '">' +
              '<p style="line-height:1.375"><span class="lead" style="' + labelStyle(havingLit) + '">' + havingLabel + '&nbsp;</span>' +
              '<span class="goal" style="' + goalStyle(havingLit) + '">' + goal + '</span></p>' +
              '<p class="desc">' + L("The thing itself, here.", "它就在这里。") + '</p>' +
            '</div>' +
          '</div>';
      } else if (S.path === "wanting") {
        var mainW = w ? wantingFull(w) : L("Wanting", "想要");
        h += '<section class="' + cls + '" aria-label="' + esc(L("You are releasing: ", "你正在释放：") + mainW) + '">' +
          '<p class="prefix">' + L("You&rsquo;re releasing", "你正在释放") + '</p>' +
          '<p class="main apricot">' + esc(mainW) + '</p>' +
          (w && inQ ? '<p style="margin-top:0.5rem;font-size:1rem;color:var(--ink-soft)">' + esc(wantingLine(w)) + '</p>' : "");
      } else {
        var main = "";
        if (S.path === "feeling") main = S.feelingWord;
        else if (S.path === "shortcut") main = isLoveStep() ? L("the love", "爱") : L("the feeling of not love", "非爱的感觉");
        if (!main) return "";
        if (S.path === "shortcut" && !isLoveStep()) {
          h += '<section class="' + cls + '" aria-label="' + esc(L("You are releasing: ", "你正在释放：") + main) + '">' +
            '<p class="prefix">' + L("You&rsquo;re releasing", "你正在释放") + '</p>' +
            '<p class="main small">' + esc(main) + '</p>';
        } else {
          h += '<section class="' + cls + '" aria-label="' + esc(L("You are releasing: ", "你正在释放：") + main) + '">' +
            '<p class="prefix">' + L("You&rsquo;re releasing", "你正在释放") + '</p>' +
            '<p class="main">' + esc(main) + '</p>';
        }
        if (S.path === "feeling" && showWantingLine && w) {
          h += '<div style="margin-top:0.75rem">' +
            '<p class="wanting-name">' + esc(wantingFull(w)) + '</p>' +
            '<p class="wanting-line">' + esc(wantingLine(w)) + '</p></div>';
        }
      }

      if (S.step !== "before" && S.path !== "shortcut") {
        var startLabel = S.path === "feeling" ? L("Feeling when you started:", "开始时的感觉：") : L("Wanting when you started:", "开始时的想要：");
        h += '<p class="meta">' + startLabel + ' <span class="num">' + S.before + ' / 10</span> · ' + intensityWord(S.before);
        if (S.layers > 1 && S.step !== "wanting" && S.step !== "after") {
          h += L(" · Layer ", " · 第 ") + S.layers + L(", last check ", " 层，上次 ") + S.after + ' / 10';
        }
        h += '</p>';
      }
      if (showWantingLine && w && S.path === "goal") {
        h += '<p class="meta" style="margin-top:0.375rem">' + L("Wanting ", "") + '<span class="num">' + esc(wantingShort(w)) + '</span> — ' + esc(wantingLine(w)) + '</p>';
      }
      h += '</section>';
      return h;
    }

    /* ── Views ────────────────────────────────────────────────────── */
    function homeHTML(total) {
      var h = '<main class="screen-in wrap">' + langBarHTML() +
        '<div class="center-col">' +
          circle(170) +
          '<h1 class="font-display" style="margin-top:2.5rem;max-width:28rem;font-size:3rem;font-weight:300;line-height:1.25;text-align:center">' + L("Nothing to fix<br>just release.", "生命在于释放<br>而非修行") + '</h1>' +
          '<p style="margin-top:1.5rem;max-width:28rem;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' + L("Releasing is a way to let a feeling finish passing through you — instead of holding it down or acting it out.", "情绪来的时候，不压抑，不抗拒，允许它来，也允许它走——这就是释放。") + '</p>' +
          '<div style="margin-top:2.5rem;width:100%;max-width:24rem">' + primaryBtn(L("Begin", "开始释放"), "begin") + '</div>' +
          '<div style="margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:1rem">' +
            '<button type="button" class="link-strong" data-action="go-how">' + L("How it works", "什么是释放法") + '</button>';
      if (total > 0) {

            '<h2 class="font-display" style="margin-top:2rem;font-size:2.25rem;font-weight:300;line-height:1.3">' + beforeHeading() + '</h2>' +
            '<p style="margin-top:1rem;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' +
              (S.path === "feeling" ? L("Let the feeling be here, and notice its strength.", "让感觉先在着，感受一下它有多强。") : L("Notice the pull of the wanting itself.", "感受一下想要的那股劲。")) +
              L(" No right answer. Just notice.", "没有对错，留意就行。") + '</p>' +
            '<div style="margin-top:3rem">' + sliderHTML(S.before, beforeLabel()) + '</div>' +
            '<div style="margin-top:auto;padding-top:3rem">' + primaryBtn(L("Continue", "继续"), "before-continue") + '</div></div>';
          break;

        case "wanting": {
          var firstWanting = S.path === "wanting" && S.layers === 1 && !S.hasBefore;
          h = '<div class="grow">' +
            '<h2 class="font-display" style="margin-top:2rem;font-size:2.25rem;font-weight:300;line-height:1.3">' +
              (firstWanting ? L("Which wanting is strongest right now?", "此刻哪个想要最强？") : L("What do you want most here?", "这里面，你最想要什么？")) + '</h2>' +
            '<p style="margin-top:1rem;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' +
              (firstWanting
                ? L("Every feeling rides on one of these three. Pick the one that feels closest — we release that wanting directly.", "每个感觉底下，都是这三个想要之一。选最像的那个，我们直接放它。")
                : L("Underneath the " + nounForQuestions() + " there&rsquo;s usually a want. Pick the one that feels closest.", "这个" + (nounForQuestions() === "feeling" ? "感觉" : "想要") + "底下，通常还有一个想要。挑最像的那个。") + (S.layers > 1 ? L(" It may be different this layer.", "这一层可能换了。") : "")) +
            '</p>' +
            '<div style="margin-top:2rem" class="stack-lg">';
          WANTINGS.forEach(function (w) {
            var sel = S.wanting === w.id;
            h += '<button type="button" class="choice-card' + (sel ? " selected" : "") + '" style="padding:1.25rem" data-action="pick-wanting" data-wanting="' + w.id + '" aria-pressed="' + sel + '" aria-label="' + esc(wantingFull(w)) + '">' +
              '<span class="card-title">' + esc(wantingShort(w)) + '</span>' +
              '<span class="card-sub">' + esc(wantingLine(w)) + '</span></button>';
          });
          h += '</div>' +
            '<div style="margin-top:auto;padding-top:3rem">' + primaryBtn(L("Continue", "继续"), "wanting-continue", S.wanting === null) + '</div></div>';
          break;
        }

        case "could":
        case "would": {
          var isCould = S.step === "could";
          var heading = isCould
            ? L("Could you let it go?", "你能放下它吗？")
            : L("Would you let it go,<br>if you could?", "你愿意放下它吗？");
          var next = isCould ? "would" : "when";
          h = questionBlock(heading, breatheNote(), yesNoButtons(next, isCould ? L("Yes", "能") : L("Yes", "愿意"), isCould ? L("No", "不能") : L("No", "不愿意")));
          break;
        }

        case "when":
          h = questionBlock(L("When?", "什么时候？"), L("The only time letting go ever happens is now.", "放下，只能发生在现在。"),
            primaryBtn(L("Now", "现在"), "when-now"));
          break;

        case "shortcutCheck":
          h = questionBlock(L("What is the feeling now?", "现在是什么感觉？"),
            "",
            primaryBtn(L("Not love", "非爱"), "check-still") + quietBtn(L("Love", "爱"), "check-love"));
          break;

        case "after":
          h = '<div class="grow">' +
            '<h2 class="font-display" style="margin-top:2rem;font-size:2.25rem;font-weight:300;line-height:1.3">' + afterHeading() + '</h2>' +
            '<p style="margin-top:1rem;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' + L("Check again, honestly. Whatever it is, it&rsquo;s fine.", "再照实看一次。多少都行。") + '</p>' +
            '<div style="margin-top:3rem">' + sliderHTML(S.after, S.path === "feeling" ? L("How strong is the feeling now, from 0 to 10?", "这个感觉现在有多强，0 到 10？") : L("How strong is the wanting now, from 0 to 10?", "这个想要现在有多强，0 到 10？")) + '</div>' +
            '<div style="margin-top:auto;padding-top:3rem">' + primaryBtn(L("Continue", "继续"), "after-continue") + '</div></div>';
          break;

        case "layerChoice":
          h = questionBlock(L("There&rsquo;s still something there — " + S.after + " out of 10.", "还没放完——现在是 " + S.after + " 分（满分 10 分）。"),
            S.path === "feeling"
              ? L("Feelings often come in layers. Under this one there may be a different want. Or you can simply stop here — stopping is fine too.", "感觉常常一层一层来。这层底下，可能还有另一个想要。停在这里也行，完全可以。")
              : L("Wanting often comes in layers. Under this one there may be a different want. Or you can simply stop here — stopping is fine too.", "想要常常一层一层来。这层底下，可能还有另一个想要。停在这里也行，完全可以。"),
            primaryBtn(L("Continue releasing", "继续释放"), "continue-releasing") + quietBtn(L("Go another layer", "再释放一层"), "another-layer") + quietBtn(L("That&rsquo;s enough for now", "先到这里"), "finish-now"));
          break;

        case "shortcutTurning":
          h = '<div class="grow" style="align-items:center;justify-content:center;padding-bottom:1.5rem">' +
            '<div>' + circle(104) + '</div>' +
            '<h2 class="font-display" style="margin-top:1.5rem;text-align:center;font-size:2.25rem;font-weight:300;line-height:1.3">' + L("Only love is left.", "只剩下爱。") + '</h2>' +
            '<p style="margin-top:1rem;max-width:28rem;text-align:center;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' + L("The feeling: not love is gone. You can rest here — this is a complete ending.", "非爱的感觉已经走了。停在这里，就是一个完整的结束。") + '</p>' +
            '<div style="margin-top:2rem;width:100%;max-width:24rem" class="stack">' +
              quietBtn(L("Rest here", "就停在这里"), "rest-here") + primaryBtn(L("Go one step further", "再往前一步"), "go-further") +
            '</div></div>';
          break;

        case "loveIntro":
          h = '<div class="grow" style="align-items:center;justify-content:center;padding-bottom:1.5rem">' +
            '<div>' + circle(104) + '</div>' +
            '<p class="font-display" style="margin-top:1.5rem;max-width:28rem;text-align:center;font-size:1.875rem;font-weight:300;line-height:1.375">' + L("Love, held on to, is still a feeling. Underneath it is the quiet that can&rsquo;t be disturbed.", "爱，抓着不放，也还是个感觉。它底下，是谁也扰动不了的安静。") + '</p>' +
            '<div style="margin-top:2rem;width:100%;max-width:24rem">' + primaryBtn(L("Continue", "继续"), "love-continue") + '</div></div>';
          break;

        case "loveCould":
        case "loveWould": {
          var isLC = S.step === "loveCould";
          var lHeading = isLC ? L("Could you let even the love go?", "连爱也能放下吗？") : L("Would you let it go,<br>if you could?", "你愿意放下它吗？");
          var lNext = isLC ? "loveWould" : "loveWhen";
          h = questionBlock(lHeading, breatheNote(), yesNoButtons(lNext, isLC ? L("Yes", "能") : L("Yes", "愿意"), isLC ? L("No", "不能") : L("No", "不愿意")));
          break;
        }

        case "loveWhen":
          h = questionBlock(L("When?", "什么时候？"), L("The only time letting go ever happens is now.", "放下，只能发生在现在。"),
            primaryBtn(L("Now", "现在"), "love-now"));
          break;
      }
      return h;
    }

    function layerLabel() {
      return LANG === "zh" ? ("第 " + S.layers + " 层") : ("Layer " + S.layers);
    }

    function sessionHTML() {
      var h = '<main class="screen-in wrap" style="padding-bottom:2.5rem">' + langBarHTML() +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:1rem">' +
          '<p style="font-size:0.875rem;color:var(--ink-soft)">' + (S.layers > 1 ? layerLabel() : "&nbsp;") + '</p>' +
          '<button type="button" data-action="go-home" aria-label="' + L("End session and go home", "结束并回到首页") + '" style="background:none;border:none;cursor:pointer;font-family:inherit;font-size:0.875rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px;padding:0">' + L("End session", "结束本次释放") + '</button>' +
        '</div>';
      if (showAnchor()) h += anchorHTML();
      h += stepHTML();
      h += '</main>';
      return h;
    }

    function endHTML(total) {
      var inner = "";
      if (S.path === "shortcut" && S.shortcutEnding === "quiet") {
        inner = '<h2 class="font-display" style="margin-top:2.5rem;font-size:2.25rem;font-weight:300;line-height:1.3">' + L("Imperturbable.", "波澜不惊。") + '</h2>' +
          '<p style="margin-top:1rem;max-width:28rem;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' + L("Nothing left to disturb.", "再没有什么能扰动你了。") + '</p>';
      } else if (S.path === "shortcut" && S.shortcutEnding === "rest") {
        inner = '<h2 class="font-display" style="margin-top:2.5rem;font-size:2.25rem;font-weight:300;line-height:1.3">' + L("Only love is left.", "只剩下爱。") + '</h2>';
      } else if (S.path === "goal" && S.after === 0) {
        inner = '<h2 class="font-display" style="margin-top:2.5rem;max-width:28rem;font-size:2.25rem;font-weight:300;line-height:1.3;overflow-wrap:break-word">' + (LANG === "zh"
          ? ('<span style="font-weight:500;color:var(--apricot-deep)">拥有</span>' + esc(S.goalText.trim()) + '。')
          : ('<span style="font-weight:500;color:var(--apricot-deep)">Having</span> ' + esc(S.goalText.trim()) + '.')) + '</h2>' +
          '<p style="margin-top:0.75rem;max-width:28rem;font-size:0.875rem;line-height:1.625;color:var(--ink-soft)">' + L("Wanting is the feeling of not having it. When the wanting goes, what&rsquo;s left is having.", "想要，就是觉得自己还没有。想要一走，剩下的就是拥有。") + '</p>';
      } else if (S.after === 0) {
        inner = '<h2 class="font-display" style="margin-top:2.5rem;font-size:2.25rem;font-weight:300;line-height:1.3">' + L("Quiet.", "安静。") + '</h2>' +
          '<p style="margin-top:1rem;max-width:28rem;font-size:1.25rem;line-height:1.625">' + L("That&rsquo;s what&rsquo;s underneath all of it.", "一切的底下，就是这个。") + '</p>';
      } else {
        inner = '<h2 class="font-display" style="margin-top:2.5rem;max-width:28rem;font-size:1.875rem;font-weight:300;line-height:1.3">' + (LANG === "zh"
          ? ("进来时 " + S.before + " 分，离开时 " + S.after + " 分。")
          : ("You came in at " + S.before + ". You&rsquo;re leaving at " + S.after + ".")) + '</h2>';
      }
      if (S.after !== 0 && S.after < S.before) {
        inner += '<p style="margin-top:1.25rem;max-width:28rem;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' + L("It moved. That&rsquo;s how this works — a little looser each time you look at it honestly.", "它松动了。就是这样：每照实看一次，就松开一点。") + '</p>';
      }
      if (S.after !== 0 && S.after >= S.before) {
        inner += '<p style="margin-top:1.25rem;max-width:28rem;font-size:1.125rem;line-height:1.625;color:var(--ink-soft)">' + L("It didn&rsquo;t move much this time. That happens. Noticing it clearly is still part of letting it pass — no striving needed.", "这次没怎么动，也正常。光是看清它，就已经在让它过去了。不用使劲。") + '</p>';
      }
      if (S.after === 0 && S.path !== "shortcut") {
        inner += '<p style="margin-top:1.25rem;font-size:1.125rem;color:var(--ink-soft)">' + (LANG === "zh"
          ? ("进来时 " + S.before + " 分，离开时 0 分。")
          : ("You came in at " + S.before + ". You&rsquo;re leaving at 0.")) + '</p>';
      }
      var h = '<main class="screen-in wrap">' + langBarHTML() + '<div class="center-col">' +
        circle(150) + inner +
        '<div style="margin-top:2rem;width:100%;max-width:24rem" class="stack">' +
          primaryBtn(L("Release something else", "再释放一个"), "begin") + quietBtn(L("Done", "完成"), "go-home") +
        '</div>';
      if (total > 0) {
        h += '<button type="button" class="link-plain" style="margin-top:2rem" data-action="go-history">' + L("See my releases", "看我的释放记录") + '</button>';
      }
      h += '</div>' + footerHTML() + '</main>';
      return h;
    }

    /* ── Flow control ─────────────────────────────────────────────── */
    function goStep(next) { S.step = next; render(true); }

    function startSession() {
      S.path = null; S.feelingWord = ""; S.expandedGroup = null; S.dontKnowOpen = false;
      S.goalText = ""; S.forkChoice = null; S.shortcutEnding = null; S.recordTopic = "";
      S.before = 5; S.wanting = null; S.after = 5; S.layers = 1;
      S.hasBefore = false; S.hasAfter = false; S.finished = false; S.saved = false;
      S.view = "session"; S.step = "choose";
      render(true);
    }

    function shortcutTopic() {
      return L("Shortcut — the feeling: not love", "捷径——那个感觉：非爱");
    }

    function finishSession(finalAfter, topicOverride) {
      S.finished = true;
      if (!S.saved) {
        S.saved = true;
        var fallback;
        if (S.path === "feeling") fallback = L("Feeling: ", "感觉：") + (S.feelingWord || L("Unnamed", "未命名"));
        else if (S.path === "goal") fallback = L("Goal: " + S.goalText.trim() + " (the wanting)", "目标：" + S.goalText.trim() + "（想要）");
        else if (S.path === "shortcut") fallback = shortcutTopic();
        else if (S.wanting) { var wi = wantingInfo(); fallback = L("Wanting: ", "想要：") + (wi ? wantingShort(wi) : S.wanting); }
        else fallback = L("Something unnamed", "未命名的东西");
        saveHistoryEntry({
          topic: topicOverride || (S.recordTopic.trim() || fallback),
          // The shortcut has no degree to record — a feeling either is
          // love or it isn't — so its entries store 0 / 0 and My Releases
          // shows no intensity figures for them.
          before: S.path === "shortcut" ? 0 : S.before,
          after: S.path === "shortcut" ? 0 : finalAfter,
          layers: S.layers,
          date: new Date().toISOString()
        });
      }
      render(true);
    }

    var ACTIONS = {
      "begin": startSession,
      "go-home": function () { S.view = "home"; render(true); },
      "go-how": function () { S.view = "how"; render(true); },
      "go-history": function () { S.view = "history"; render(true); },
      "lang-en": function () { setLang("en"); },
      "lang-zh": function () { setLang("zh"); },
      "avatar-open": function () { S.avatarOpen = true; render(false); },
      "avatar-close": function () { S.avatarOpen = false; render(false); },

      "choose-feeling": function () { S.path = "feeling"; goStep("feeling"); },
      "choose-goal": function () { S.path = "goal"; goStep("goalInput"); },
      "choose-wanting": function () { S.path = "wanting"; goStep("wanting"); },
      "choose-shortcut": function () {
        S.path = "shortcut";
        S.recordTopic = shortcutTopic();
        goStep("shortcutChoice");
      },
      "shortcut-choice-love": function () { goStep("shortcutTurning"); },
      "shortcut-choice-notlove": function () { goStep("shortcutIntro"); },
      "shortcut-begin": function () { goStep("could"); },

      "dont-know": function () { S.dontKnowOpen = true; S.expandedGroup = "Apathy"; render(false); },
      "toggle-group": function (el) {
        var g = el.getAttribute("data-group");
        S.expandedGroup = (S.expandedGroup === g) ? null : g;
        render(false);
      },
      "pick-word": function (el) {
        S.feelingWord = el.getAttribute("data-word") || "";
        S.recordTopic = L("Feeling: ", "感觉：") + S.feelingWord;
        goStep("before");
      },

      "goal-continue": function () {
        S.recordTopic = L("Goal: " + S.goalText.trim() + " (the wanting)", "目标：" + S.goalText.trim() + "（想要）");
        S.forkChoice = null;
        goStep("goalFork");
      },
      "fork-wanting": function () { S.forkChoice = "wanting"; render(false); },
      "fork-having": function () { S.forkChoice = "having"; render(false); },
      "fork-continue": function () { goStep("before"); },

      "before-continue": function () {
        S.hasBefore = true;
        goStep(S.path === "wanting" ? "could" : "wanting");
      },
      "pick-wanting": function (el) {
        S.wanting = el.getAttribute("data-wanting");
        if (S.path === "wanting" && S.layers === 1 && !S.hasBefore) {
          var wi = wantingInfo();
          if (wi) S.recordTopic = L("Wanting: ", "想要：") + wantingShort(wi);
        }
        render(false);
      },
      "wanting-continue": function () {
        goStep((S.path === "wanting" && !S.hasBefore) ? "before" : "could");
      },

      "answer": function (el) { goStep(el.getAttribute("data-next")); },
      "when-now": function () { goStep(S.path === "shortcut" ? "shortcutCheck" : "after"); },

      "check-still": function () { S.layers += 1; goStep("could"); },
      "check-love": function () { goStep("shortcutTurning"); },

      "after-continue": function () {
        S.hasAfter = true;
        if (S.after === 0) finishSession(0); else goStep("layerChoice");
      },
      "continue-releasing": function () { goStep("could"); },
      "another-layer": function () { S.layers += 1; S.wanting = null; goStep("wanting"); },
      "finish-now": function () { finishSession(S.after); },

      "rest-here": function () {
        S.shortcutEnding = "rest"; S.after = 0;
        finishSession(0, shortcutTopic());
      },
      "go-further": function () { goStep("loveIntro"); },
      "love-continue": function () { goStep("loveCould"); },
      "love-now": function () {
        S.shortcutEnding = "quiet"; S.after = 0;
        finishSession(0, L("Shortcut — the feeling: not love (through love, to imperturbable)", "捷径——那个感觉：非爱（经由爱，到波澜不惊）"));
      }
    };

    /* ── Render ───────────────────────────────────────────────────── */
    var app = document.getElementById("app");

    function render(scrollTop) {
      var history = loadHistory();
      var html = "";
      if (S.view === "home") html = homeHTML(history.length);
      else if (S.view === "how") html = howHTML();
      else if (S.view === "history") html = historyHTML(history);
      else if (S.view === "session") html = S.finished ? endHTML(history.length) : sessionHTML();
      app.innerHTML = '<div class="page">' + html + '</div>';
      persistSnapshot();
      if (scrollTop) scrollToTop();
    }

    app.addEventListener("click", function (e) {
      var el = e.target.closest ? e.target.closest("[data-action]") : null;
      if (!el) return;
      var fn = ACTIONS[el.getAttribute("data-action")];
      if (fn) fn(el, e);
    });

    app.addEventListener("input", function (e) {
      var t = e.target;
      if (t.id === "intensity-slider") {
        var v = Number(t.value);
        if (S.step === "before") S.before = v; else if (S.step === "after") { S.after = v; S.hasAfter = true; }
        t.style.setProperty("--fill", (v * 10) + "%");
        var wrap = t.parentNode;
        var big = wrap.querySelector(".font-display");
        var wordEl = big ? big.nextElementSibling : null;
        if (big) big.textContent = v;
        if (wordEl) wordEl.textContent = intensityWord(v);
        // Keep the goal anchor's light in step while rating.
        if (S.path === "goal" && (S.step === "before" || S.step === "after")) {
          app.querySelectorAll("section.anchor").forEach(function (a) {
            var fresh = document.createElement("div");
            fresh.innerHTML = anchorHTML();
            a.replaceWith(fresh.firstChild);
          });
        }
        persistSnapshot();
      }
      if (t.id === "goal-input") {
        S.goalText = t.value;
        var btn = app.querySelector('[data-action="goal-continue"]');
        if (btn) btn.disabled = S.goalText.trim().length === 0;
        persistSnapshot();
      }
    });

    // Pull-down guard: a downward drag that starts at the very top is an
    // overscroll pull — swallow it so it can never become a
    // pull-to-refresh. Normal scrolling is untouched.
    (function () {
      var lastY = null;
      document.addEventListener("touchstart", function (e) {
        lastY = e.touches[0] ? e.touches[0].clientY : null;
      }, { passive: true });
      document.addEventListener("touchmove", function (e) {
        var y = e.touches[0] ? e.touches[0].clientY : undefined;
        if (y === undefined) return;
        var top = window.scrollY <= 0 && (!document.scrollingElement || document.scrollingElement.scrollTop <= 0);
        if (lastY !== null && top && y > lastY && e.cancelable) e.preventDefault();
        lastY = y;
      }, { passive: false });
      document.addEventListener("touchend", function () { lastY = null; });
      document.addEventListener("touchcancel", function () { lastY = null; });
    })();

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && S.avatarOpen) { S.avatarOpen = false; render(false); }
    });

    render(true);

    </script>
  </body>
</html>
